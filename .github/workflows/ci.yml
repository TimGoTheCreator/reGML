name: CI

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libpng-dev libvorbis-dev libsdl2-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON
          cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-linux
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-linux-x86_64
          path: build/regml
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: vcpkg install libpng:x64-windows libvorbis:x64-windows sdl2:x64-windows
      - name: Configure and build
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release --parallel
      - name: Run tests
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_RENDER_DRIVER = 'software'
          ctest --test-dir build --output-on-failure -C Release
      - name: Try package screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force demo | Out-Null
          .\build\Release\regml.exe run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - name: Stage Windows binary and runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows-x64 | Out-Null
          Copy-Item build/Release/regml.exe release/windows-x64/
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -Filter '*.dll' |
            Copy-Item -Destination release/windows-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: regml-windows-x64
          path: release/windows-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: game-windows
          path: demo/demo.bmp
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake libpng libvorbis sdl2 pkg-config
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON
          cmake --build build --config Release --parallel
      - name: Run tests
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure -C Release
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-macos
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-macos-${{ runner.arch }}
          path: build/regml
          if-no-files-found: error

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: freebsd-14.3-${{ github.sha }}
          restore-keys: freebsd-14.3-
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          prepare: pkg install -y cmake ninja pkgconf png libvorbis sdl2 ccache
          run: |
            mkdir -p "$PWD/host_cache/ccache"
            export CCACHE_DIR="$PWD/host_cache/ccache"
            export CCACHE_BASEDIR="$PWD"
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build --parallel
            env SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
            mkdir -p demo
            ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp || echo "Package screenshot attempt failed"
      - uses: actions/upload-artifact@v4
        with:
          name: game-freebsd
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-freebsd-x86_64
          path: build/regml
          if-no-files-found: error

  netbsd:
    name: NetBSD
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: netbsd-11.0-${{ github.sha }}
          restore-keys: netbsd-11.0-
      - name: Start NetBSD VM
        uses: cross-platform-actions/action@b77f08480307e762b98be92ba7ef04ea7c2272f8
        with:
          operating_system: netbsd
          architecture: x86-64
          version: '11.0'
      - name: Install dependencies
        run: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          if ! command -v pkgin >/dev/null 2>&1; then
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -d_ -f1)/All/"
            sudo pkg_add pkgin
          fi
          sudo pkgin -y update
          sudo pkgin -y install cmake ninja-build pkgconf png libvorbis SDL2 ccache
      - name: Configure and build
        run: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          mkdir -p "$PWD/host_cache/ccache"
          export CCACHE_DIR="$PWD/host_cache/ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Run tests
        run: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
      - name: Try package screenshot
        continue-on-error: true
        run: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-netbsd
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-netbsd-x86_64
          path: build/regml
          if-no-files-found: error

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: openbsd-7.9-${{ github.sha }}
          restore-keys: openbsd-7.9-
      - name: Start OpenBSD VM
        uses: cross-platform-actions/action@b77f08480307e762b98be92ba7ef04ea7c2272f8
        with:
          operating_system: openbsd
          architecture: x86-64
          version: '7.9'
      - name: Install dependencies
        run: sudo pkg_add -I cmake ninja pkgconf png libvorbis sdl2 ccache
      - name: Configure and build
        run: |
          mkdir -p "$PWD/host_cache/ccache"
          export CCACHE_DIR="$PWD/host_cache/ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Run tests
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-openbsd
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-openbsd-x86_64
          path: build/regml
          if-no-files-found: error

  dragonflybsd:
    name: DragonFly BSD
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: dragonflybsd-6.4.2-${{ github.sha }}
          restore-keys: dragonflybsd-6.4.2-
      - name: Start DragonFly BSD VM
        uses: cross-platform-actions/action@b77f08480307e762b98be92ba7ef04ea7c2272f8
        with:
          operating_system: dragonflybsd
          architecture: x86-64
          version: '6.4.2'
      - name: Install dependencies
        run: |
          # The Avalon repository can be unavailable; use DragonFly's AUTO mirror.
          sudo mkdir -p /usr/local/etc/pkg/repos
          sudo tee /usr/local/etc/pkg/repos/df-latest.conf >/dev/null <<'EOF'
          AUTO: {
            url: "https://pkg.dragonflybsd.org/pkg/${ABI}/LATEST"
            mirror_type: "HTTP"
            enabled: yes
          }
          EOF
          sudo pkg update -f
          sudo pkg install -y cmake ninja pkgconf png libvorbis sdl2 ccache
      - name: Configure and build
        run: |
          mkdir -p "$PWD/host_cache/ccache"
          export CCACHE_DIR="$PWD/host_cache/ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Run tests
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-dragonflybsd
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-dragonflybsd-x86_64
          path: build/regml
          if-no-files-found: error

  midnightbsd:
    name: MidnightBSD
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: midnightbsd-4.0.4-${{ github.sha }}
          restore-keys: midnightbsd-4.0.4-
      - name: Start MidnightBSD VM
        uses: cross-platform-actions/action@b77f08480307e762b98be92ba7ef04ea7c2272f8
        with:
          operating_system: midnightbsd
          architecture: x86-64
          version: '4.0.4'
      - name: Install dependencies
        timeout-minutes: 20
        run: doas mport install -y cmake ninja pkgconf png libvorbis sdl2 ccache gcc13
      - name: Configure and build
        run: |
          mkdir -p "$PWD/host_cache/ccache"
          export CCACHE_DIR="$PWD/host_cache/ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          export CC=/usr/local/bin/gcc13
          export CXX=/usr/local/bin/g++13
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Run tests
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-midnightbsd
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-midnightbsd-x86_64
          path: build/regml
          if-no-files-found: error

  haiku:
    name: Haiku
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Haiku caches
        uses: actions/cache@v4
        with:
          path: |
            host_cache/ccache
            host_cache/packages
          key: haiku-r1beta6-${{ github.sha }}
          restore-keys: haiku-r1beta6-
      - name: Start Haiku VM
        uses: cross-platform-actions/action@b77f08480307e762b98be92ba7ef04ea7c2272f8
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta6'
      - name: Install dependencies
        run: |
          mkdir -p host_cache/packages
          if ls host_cache/packages/*.hpkg >/dev/null 2>&1; then
            pkgman install -y host_cache/packages/*.hpkg || true
          fi

          ls /boot/system/packages/ > baseline_packages.txt
          pkgman install -y cmake make ccache gcc gcc_syslibs_devel libpng16_devel libvorbis_devel bzip2_devel libsdl2_devel
          ls /boot/system/packages/ > current_packages.txt

          comm -13 baseline_packages.txt current_packages.txt | while IFS= read -r pkg; do
            if [ -n "$pkg" ]; then
              cp "/boot/system/packages/$pkg" host_cache/packages/
            fi
          done
      - name: Configure and build
        run: |
          mkdir -p "$PWD/host_cache/ccache"
          export CCACHE_DIR="$PWD/host_cache/ccache"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREGML_SDL2=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
      - name: Run tests
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ctest --test-dir build --output-on-failure
      - name: Try package screenshot
        continue-on-error: true
        run: |
          mkdir -p demo
          ./build/regml run include/data.win --headless --frames 90 --screenshot demo/demo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: game-haiku
          path: demo/demo.bmp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: regml-haiku-x86_64
          path: build/regml
          if-no-files-found: error

  wii:
    name: Wii
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii libraries
        run: dkp-pacman -S --noconfirm --needed wii-dev ppc-libpng ppc-libvorbis ppc-zlib
      - name: Build DOL
        run: |
          /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake -S . -B build/wii \
            -DCMAKE_BUILD_TYPE=Release -DREGML_WII=ON -DBUILD_TESTING=OFF
          make -C build/wii -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: regml-wii
          path: build/wii/regml.dol
          if-no-files-found: error

  wii-u:
    name: Wii U
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        run: dkp-pacman -S --noconfirm --needed wiiu-dev wiiu-sdl2 ppc-libpng ppc-libvorbis
      - name: Build RPX
        run: |
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake -S . -B build/wiiu \
            -DCMAKE_BUILD_TYPE=Release -DREGML_WIIU=ON -DBUILD_TESTING=OFF
          make -C build/wiiu -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: regml-wii-u
          path: |
            build/wiiu/regml.rpx
            build/wiiu/regml.wuhb
          if-no-files-found: error

  ps2:
    name: PlayStation 2
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: apk add --no-cache build-base cmake
      - name: Build ELF
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
          cmake -S . -B build/ps2 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" -DPS2=ON -DBUILD_TESTING=OFF
          cmake --build build/ps2 --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: regml-ps2
          path: build/ps2/regml.elf
          if-no-files-found: error

  ps4:
    name: PlayStation 4
    runs-on: ubuntu-24.04
    env:
      REGML_PS4_DEPS_ROOT: ${{ runner.temp }}/regml-ps4-deps
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build git curl
      - uses: actions/cache@v4
        id: cache-openorbis
        with:
          path: ${{ runner.temp }}/openorbis-v0.5.4
          key: openorbis-v0.5.4-linux-x86_64
      - name: Install OpenOrbis toolchain
        run: |
          if [ "${{ steps.cache-openorbis.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$RUNNER_TEMP/openorbis-v0.5.4"
            curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
              -o "$RUNNER_TEMP/openorbis-v0.5.4/toolchain.tar.gz"
            tar -xzf "$RUNNER_TEMP/openorbis-v0.5.4/toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis-v0.5.4"
          fi
          toolchain_root="$(dirname "$(find "$RUNNER_TEMP/openorbis-v0.5.4" -name link.x -type f -print -quit)")"
          test -f "$toolchain_root/link.x"
          echo "OO_PS4_TOOLCHAIN=$toolchain_root" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin/linux" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/regml-ps4-deps
          key: regml-ps4-deps-zlib-1.3.1-ogg-1.3.5-vorbis-1.3.7-png-1.6.50-bzip2-1.0.8
      - name: Build PS4 libraries
        run: bash tools/build_ps4_dependencies.sh
      - name: Configure and build PS4 binaries
        run: |
          cmake -S . -B build/ps4 -G Ninja \
            --toolchain cmake/toolchains/ps4-openorbis.cmake \
            -DREGML_PS4=ON -DREGML_SDL2=ON -DBUILD_TESTING=OFF \
            -DREGML_PS4_DEPS_ROOT="$REGML_PS4_DEPS_ROOT" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ps4 --target regml_eboot --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: regml-ps4
          path: |
            build/ps4/regml.elf
            build/ps4/regml.oelf
            build/ps4/eboot.bin
          if-no-files-found: error
